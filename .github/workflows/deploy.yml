name: Build and Deploy

on:
  push:
    branches: [main]
  schedule:
    # Every month on the 5th, 03:30 UTC: refresh OpenSky data.
    - cron: "30 3 5 * *"
  workflow_dispatch:

permissions:
  contents: write     # for committing refreshed data on schedule
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        if: github.event_name != 'push'
        run: pip install pypinyin

      - name: Fetch latest OpenSky aircraft database
        if: github.event_name != 'push'
        run: python scripts/fetch_opensky.py

      - name: Build aircraft.json
        if: github.event_name != 'push'
        run: python scripts/build_data.py

      - name: Commit refreshed data (scheduled runs)
        if: github.event_name == 'schedule'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/aircraft.json public/data/aircraft.col.json public/data/meta.json public/data/cabin_layouts.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh from $(cat data/raw/source.txt | tr -d '\n')"
            git push
          else
            echo "No data changes."
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
